# Admins (gpuadmins) get a real shell — must appear before the gpuusers block
Match Group gpuadmins
    PermitTTY yes
    X11Forwarding no

Match Group gpuusers
    ForceCommand /usr/local/bin/iit-gpu-gateway
    PermitTTY yes
    # Allow local port-forwards (-L) only — needed for JupyterLab/TensorBoard tunnels.
    # Restricted to the compute node (192.168.122.1) so users cannot use the
    # gateway as a jump host to reach other internal hosts.
    AllowTcpForwarding local
    PermitOpen 192.168.122.1:*
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    PermitUserRC no
